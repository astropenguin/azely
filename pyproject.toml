[project]
name = "azely"
version = "1.0.0"
description = "Azimuth/elevation calculator for astronomical objects"
readme = "README.md"
keywords = [
    "astronomy",
    "azimuth",
    "elevation",
    "ephemeris",
    "sidereal-time",
    "visibility",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "astropy>=6",
    "dateparser>=1",
    "ipinfo>=4",
    "matplotlib>=3",
    "numpy>=2",
    "pandas>=2",
    "python-dateutil>=2",
    "timezonefinder>=6",
    "tomlkit>=0.10,<1.0",
    "typing-extensions>=4",

]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[[project.authors]]
name = "Akio Taniguchi"
email = "taniguchi.akio@gmail.com"

[project.license]
file = "LICENSE"

[project.urls]
homepage = "https://astropenguin.github.io/azely/1.0.0"
repository = "https://github.com/astropenguin/azely"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26",
    "ipython>=8",
    "myst-parser>=4",
    "pandas-stubs>=2",
    "pydata-sphinx-theme>=0.19",
    "pyright>=1",
    "pytest>=9",
    "sphinx>=8",
]

[tool.pyright]
typeCheckingMode = "basic"
